<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: navegação lateral fixa + mesa de trabalho densa (tabelas, formulários em linha, painéis de indicadores) */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#e9edf1; --line:#d8dee5;
  --fg:#14181d; --muted:#586471; --accent:#2a4bd7; --accent-fg:#ffffff;
  --ok:#17794a; --warn:#9a5b00; --bad:#bb2530;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Space Grotesk','Inter',system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1317; --surface:#171c21; --surface-2:#1f262d; --line:#2a323a;
  --fg:#e8ecf0; --muted:#97a3af; --accent:#7f9cff; --accent-fg:#0b1020;
  --ok:#4cc58a; --warn:#e3a33a; --bad:#ff7a82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1317; --surface:#171c21; --surface-2:#1f262d; --line:#2a323a;
  --fg:#e8ecf0; --muted:#97a3af; --accent:#7f9cff; --accent-fg:#0b1020;
  --ok:#4cc58a; --warn:#e3a33a; --bad:#ff7a82; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:24px;max-width:1360px;margin:0 auto;padding-block:16px 40px}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;display:flex;flex-direction:column;gap:18px;padding-block:4px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:700 15px var(--font-display)}
.brand b{font:700 17px var(--font-display);display:block;line-height:1.1}
.brand span{font-size:11.5px;color:var(--muted)}
.grp{display:flex;flex-direction:column;gap:2px}
.grp h3{font:600 10.5px var(--font-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:0 10px 4px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;
  padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--fg);font-weight:500;font-size:13px}
.nav:hover{background:var(--surface-2)}
.nav[aria-current="page"]{background:var(--fg);color:var(--bg)}
.badge{font:600 11px var(--font-body);min-width:20px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-variant-numeric:tabular-nums}
.nav[aria-current="page"] .badge{background:color-mix(in srgb,var(--bg) 25%,transparent);color:var(--bg)}
.badge.alert{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.side-f{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.main{min-width:0}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:10px}
.crumb b{color:var(--fg);font-weight:500}
.crumb small{font-size:10.5px;font-weight:500}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.head h1{font-size:24px}
.head p{margin:3px 0 0;color:var(--muted);max-width:62ch}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px}
:is(button,input,select,textarea,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=tel],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{min-height:68px;resize:vertical}
.search{flex:1;min-width:180px;max-width:340px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel+.panel{margin-top:16px}
.panel h2{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font:400 12px var(--font-body);color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 11px var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.r{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:12px}
.sub{color:var(--muted);font-size:12px}
.p{font-weight:500}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.kpi{padding:14px 16px;border-right:1px solid var(--line);min-width:0}
.kpi:last-child{border-right:0}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{display:block;font:600 22px var(--font-display);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.grid2 .panel+.panel{margin-top:0}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px}
.fill.ok{background:var(--ok)}.fill.warn{background:var(--warn)}.fill.bad{background:var(--bad)}
.val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12.5px;min-width:44px;text-align:right}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:78px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.feed li:last-child{border-bottom:0}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12px;color:var(--muted);font-weight:500}
.f.s2{grid-column:span 2}.f.s4{grid-column:1/-1}
.f.chk{flex-direction:row;align-items:center;gap:8px;padding-top:22px}
.f.chk input{width:auto}
.items{display:flex;flex-direction:column;gap:8px;margin:6px 0 8px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 110px 130px 34px;gap:8px;align-items:center}
.irow.n3{grid-template-columns:minmax(0,1fr) 110px 34px}
.irow.n4{grid-template-columns:minmax(0,1fr) 110px 120px 34px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;border-radius:6px;width:30px;height:30px}
.x:hover{background:var(--surface-2);color:var(--fg)}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--fg) 45%,transparent);display:grid;place-items:start center;overflow-y:auto;z-index:20;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(100%,760px);margin-block:auto}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:17px}
.dlg-b{padding:18px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kv div span{display:block;font-size:12px;color:var(--muted)}
.tot{display:flex;flex-direction:column;gap:4px;align-items:flex-end;margin-top:12px;font-variant-numeric:tabular-nums}
.tot div{display:flex;gap:24px;justify-content:space-between;min-width:260px}
.tot .big{font:600 17px var(--font-display);padding-top:6px;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:500;max-width:min(92vw,480px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;gap:10px}
  .side .grp h3,.side-f .note{display:none}
  .side nav{display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}
  .side .grp{flex-direction:row;gap:4px}
  .nav{white-space:nowrap}
  .side-f{flex-direction:row;border:0;padding:0}
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-right:0;border-bottom:1px solid var(--line)}
  .irow,.irow.n3,.irow.n4{grid-template-columns:minmax(0,1fr) 84px 34px}
  .irow>.xtra{grid-column:1/-1;order:5}
}
@media (max-width:480px){.form-grid{grid-template-columns:minmax(0,1fr)}.f.s2{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">S</div><div><b>Sinapse</b><span>Aniel · Matriz Operacional</span></div></div>
    <nav id="nav"></nav>
    <div class="side-f">

  </aside>
  <main class="main" id="view"></main>
</div>
<div class="ov" id="modal" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="dlg-h"><h2 id="mt"></h2><button class="x" data-a="close" aria-label="Fechar">×</button></div><div class="dlg-b" id="mb"></div></div></div>

<script>

const pill=(t,c)=>'<span class="pill '+(c||'')+'">'+esc(t)+'</span>';

function osTotals(o,products){

  const est=o.laborCost+o.estimatedSupplies.reduce((a,s)=>a+s.quantity*(s.unitPrice!=null?s.unitPrice:price(s.productId)),0);
  const real=o.laborCost+o.appliedSupplies.reduce((a,s)=>a+s.quantity*(s.unitPrice!=null?s.unitPrice:price(s.productId)),0);

function subCustody(c,pid,q){const e=c.custody.find(i=>i.productId===pid);e.quantity-=q;if(e.quantity<=0.0000001)c.custody=c.custody.filter(i=>i.productId!==pid)}
function checkCustody(c,items){for(const i of items){const e=c.custody.find(x=>x.productId===i.productId);const have=e?e.quantity:0;if(have<i.quantity)return'Custódia insuficiente de '+i.productName+': '+c.matricola+' tem '+num(have)+' '+i.unit+'.'}return null}

function rowHTML(kind,mat,withCond){

function readItems(form){
  const fd=new FormData(form);const pids=fd.getAll('pid'),q=fd.getAll('qty'),cost=fd.getAll('cost'),cond=fd.getAll('cond');const out=[];
  pids.forEach((id,i)=>{const p=prod(id);const n=parseFloat(q[i]);if(p&&n>0)out.push({productId:id,productName:p.name,sku:p.sku,unit:p.unit,quantity:n,unitCost:cost[i]!==undefined&&cost[i]!==''?parseFloat(cost[i]):p.unitCost,condition:cond[i]})});
  return out;
}

/* ---------- navegação e renderização ---------- */
const NAV=[
  ['Visão geral',[['dashboard','Painel analítico'],['produtividade','Produtividade']]],
  ['Cadastros',[['clientes','Clientes'],['colaboradores','Colaboradores'],['produtos','Produtos'],['veiculos','Veículos']]],
  ['Almoxarifado',[['entradas','Entradas e estoque']]],
  ['Serviços',[['ordens','Ordens e orçamentos'],['requisicoes','Requisição (RM)'],['aplicacao','Aplicação de insumos'],['devolucao','Devolução de sobras']]]
];
function badgeFor(v){
  if(v==='ordens')return'<span class="badge">'+S.orders.filter(o=>OPEN.includes(o.status)).length+'</span>';
  if(v==='requisicoes'){const n=S.rms.filter(r=>r.status==='pendente').length;return n?'<span class="badge alert">'+n+'</span>':''}
  if(v==='entradas'){const n=lowStock().length;return n?'<span class="badge alert">'+n+'</span>':''}
  return'';
}
function crumb(){let t='';NAV.forEach(g=>g[1].forEach(i=>{if(i[0]===U.view)t=i[1]}));return'<div class="crumb"><span>Sinapse</span><span aria-hidden="true">·</span><b>'+esc(t)+'</b><span aria-hidden="true">·</span><span>Multi-Setor</span><span aria-hidden="true">·</span><small>Projeto de : Evandro Marconato</small></div>'}
function renderNav(){$('#nav').innerHTML=NAV.map(g=>'<div class="grp"><h3>'+g[0]+'</h3>'+g[1].map(i=>'<button class="nav" data-a="nav" data-v="'+i[0]+'"'+(U.view===i[0]?' aria-current="page"':'')+'><span>'+i[1]+'</span>'+badgeFor(i[0])+'</button>').join('')+'</div>').join('')}
function render(){
  const a=document.activeElement;const keep=a&&a.dataset&&a.dataset.search?{id:a.id,s:a.selectionStart}:null;
  renderNav();$('#view').innerHTML=crumb()+VIEWS[U.view]();
  if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.s)}catch(e){}}}
}
function go(v,push){if(!VIEWS[v])v='dashboard';U.view=v;if(push!==false){try{location.hash=v}catch(e){}}render();window.scrollTo(0,0)}

const ACT={
  nav:t=>go(t.dataset.v),
  close:()=>closeModal(),
  'confirm-yes':()=>{const f=U.confirmFn;closeModal();if(f)f()},
  demo:()=>confirmModal('Substituir os dados atuais pelos dados de exemplo?',()=>{S=seed();save();toast('Dados de exemplo carregados.');render()}),
  wipe:()=>confirmModal('Apagar todos os dados deste navegador e começar do zero?',()=>{S=emptyState();save();toast('Base zerada.');render()}),
  'cad-new':t=>openCad(t.dataset.k),
  'cad-edit':t=>openCad(t.dataset.k,t.dataset.id),
  'cad-del':t=>{const k=t.dataset.k,c=CAD[k],r=S[c.s].find(x=>x.id===t.dataset.id);if(!r)return;
    if(k==='colaboradores'&&r.custody.length)return toast('Devolva os insumos em custódia antes de excluir esta matrícula.');
    confirmModal('Excluir '+c.one+' "'+(r.name||r.plate||r.sku)+'"?',()=>{S[c.s]=S[c.s].filter(x=>x.id!==r.id);save();toast('Registro excluído.');render()})},
  custody:t=>{const c=S.collabs.find(x=>x.id===t.dataset.id);openModal('Custódia de '+c.matricola,table([{h:'Insumo',f:r=>sub(r.productName,r.sku)},{h:'Quantidade',c:'r',f:r=>num(r.quantity)+' '+esc(r.unit)},{h:'Atualizado',f:r=>fdate(r.lastUpdated)}],c.custody,'Sem itens.'))},
  'ent-new':()=>openEntry(),
  'os-new':()=>openOrder(),
  'os-open':t=>openOS(t.dataset.id),
  'os-filter':t=>{U.osFilter=t.dataset.v;render()},
  'os-status':t=>{const o=orderById(t.dataset.id);o.status=t.dataset.v;if(o.status==='concluido')o.completionDate=today();save();render();openOS(o.id);toast(o.code+': '+STATUS[o.status][0].toLowerCase()+'.')},
  'os-copy':t=>{const o=orderById(t.dataset.id);const txt=o.code+' · '+o.title+'\nCliente: '+o.clientName+'\nTécnico: '+o.assignedTechnicianName+'\nStatus: '+STATUS[o.status][0]+'\nTotal previsto: '+brl(o.totalEstimated)+'\nTotal real: '+brl(o.totalReal);
    try{navigator.clipboard.writeText(txt).then(()=>toast('Resumo copiado.'),()=>toast('O navegador bloqueou a cópia.'))}catch(e){toast('O navegador bloqueou a cópia.')}},
  'go-flow':t=>{U.pre={os:t.dataset.id};closeModal();go(t.dataset.v)},
  'rm-confirm':t=>{const rm=S.rms.find(r=>r.id===t.dataset.id);const err=dispenseRM(rm);if(err)return toast(err);rm.status='retirado';rm.date=today();save();toast(rm.rmNumber+' retirada.');render()},
  'row-add':t=>{const form=t.closest('form');const box=t.parentElement.querySelector('.items');const kind=box.dataset.kind;const m=form.querySelector('[name=mat]');if(box.querySelector('.note'))box.innerHTML='';box.insertAdjacentHTML('beforeend',rowHTML(kind,m&&m.value,!!box.dataset.cond))},
  'row-del':t=>{const box=t.closest('.items');t.closest('.irow').remove();if(!box.children.length){const f=box.closest('form'),m=f.querySelector('[name=mat]');box.innerHTML=rowHTML(box.dataset.kind,m&&m.value,!!box.dataset.cond)}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&ACT[t.dataset.a]){e.preventDefault();ACT[t.dataset.a](t)}else if(e.target.id==='modal')closeModal()});
document.addEventListener('input',e=>{const s=e.target.dataset&&e.target.dataset.search;if(s){U.q[s]=e.target.value;render()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.cus){const box=t.closest('form').querySelector('.items');box.innerHTML=rowHTML('cus',t.value,!!box.dataset.cond)}
  if(t.name==='pid'){const row=t.closest('.irow'),cost=row&&row.querySelector('[name=cost]');if(cost&&!cost.value){const p=prod(t.value);if(p)cost.value=p.unitCost}}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='mform'){if(U.modalFn&&U.modalFn(f))closeModal();return}
  const h=SUBMIT[f.dataset.form];if(h)h(f);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
window.addEventListener('hashchange',()=>{const v=(location.hash||'').slice(1);if(v&&VIEWS[v]&&v!==U.view){U.view=v;render()}});
{const v=(location.hash||'').slice(1);if(VIEWS[v])U.view=v}
render();
</script>
